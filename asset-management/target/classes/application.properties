spring.application.name=asset-management

server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------
# Same MySQL database / credentials the original NetBeans project
# used (hibernate.cfg.xml / DBUtil.java). Override with env vars
# or edit directly if your DB is different.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3301/asset_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:shankar@1438}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Same behaviour as hibernate.hbm2ddl.auto=update in the original project:
# creates/updates tables automatically on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

logging.level.org.hibernate.SQL=DEBUG

# Keeps field names as-is (assetId stays assetId, not asset_id)
# Matches the original project's column naming exactly
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
